# OKEGuiDX-tools version lock
#
# This file is the single source of truth for every external tool version.
# CI rebuilds a tool only when its entry here changes, so bumping a version is
# a one-line edit plus a commit.
#
# Format: one `tool<TAB>repo<TAB>ref<TAB>variant<TAB>targets` line per build.
#   tool     logical name, matching the output directory under tools/
#   repo     upstream repository URL
#   ref      exact tag or commit hash (never a branch)
#   variant  build flavour, empty for the default
#   targets  comma-separated allow-list; empty means every target
#
# GPL compliance (TOOLS-REPO.md §8): the repo URL plus the exact ref recorded
# here is the written offer of corresponding source for the binaries we
# redistribute. Do not record a branch name, and do not edit a ref without
# rebuilding and republishing.

# --- encoders -------------------------------------------------------------

# x265 ships in three flavours. win-x64 gets all of them so the engine can pick
# at runtime; every other target gets upstream only.
#
#   upstream  the modern 4.x line, which carries the ARM NEON and RISC-V RVV
#             work. This is the default everywhere except win-x64.
#   asuna     the Yuuki-Asuna fork, frozen at the 3.5 (2021) baseline. Retained
#             because existing Windows output was produced with it.
#   kyouko    AmusementClub's Kyouko build, based on upstream 4.1. This is what
#             the current .NET release actually ships (see release.yaml), so it
#             is the behaviour-preserving default on win-x64.
x265	https://bitbucket.org/multicoreware/x265_git.git	4.1	upstream
x265	https://github.com/msg7086/x265-Yuuki-Asuna.git	85189f81fe1f7b4cdd57524c8b71121b07eee6c0	asuna	win-x64
x265	https://github.com/AmusementClub/x265.git	1a9d0ba396eb135e72d7a746e67ea16af738384c	kyouko	win-x64

# x264 follows the same rule as x265: the x86-oriented tmod fork is built only
# for win-x64, everything else uses upstream, whose NEON assembly is mature.
#
# The upstream ref is the commit that "stable" pointed at when this was written.
# A branch name would drift, and this file is the written offer of corresponding
# source for the binaries we redistribute.
x264	https://code.videolan.org/videolan/x264.git	b35605ace3ddf7c1a5d67a2eb553f034aef41d55	upstream
x264	https://github.com/jpsdr/x264.git	fb6c86416130b9c20f4d1fa36c93276b142036de	tmod	win-x64

svtav1	https://github.com/AOMediaCodec/SVT-AV1.git	v4.2.0	upstream

# --- containers and muxing ------------------------------------------------

# mkvtoolnix is pinned to v58.0.0 rather than a current release, and that is a
# deliberate trade rather than a stale entry. Upstream made Qt 6 mandatory for
# every binary, including the command-line tools, in v59: NEWS.md for v96 states
# that the options for choosing or disabling Qt "have been removed (e.g.
# --disable-qt6)", and the Alpine package for 102.0 depends on libQt6Core.so.6
# even for the CLI subpackage. v58.0.0 is the last release whose CLI tools are
# genuinely Qt-free, which is what lets five targets (including riscv64, where
# Qt has no packages at all) build without a Qt cross-build.
#
# The URL is the release tarball directory rather than a git repository: the
# recipe fetches the signed tarball. The ref is the version, and the recipe
# verifies its SHA-256.
mkvtoolnix	https://mkvtoolnix.download/sources	v58.0.0	upstream

l-smash	https://github.com/l-smash/l-smash.git	v2.14.5	upstream

# --- audio ----------------------------------------------------------------

flac	https://github.com/xiph/flac.git	1.5.0	upstream

