name: build

# Rebuilds a tool only when its version in versions.lock changes, or when a
# recipe changes. versions.lock is the single source of truth for versions
# (TOOLS-REPO.md §6).
on:
  push:
    branches: [main]
    paths:
      - "versions.lock"
      - "recipes/**"
      - "targets/**"
      - "scripts/**"
      - ".github/workflows/build.yml"
  pull_request:
    paths:
      - "versions.lock"
      - "recipes/**"
      - "targets/**"
      - "scripts/**"
      - ".github/workflows/build.yml"
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Derives the build matrix from versions.lock, so adding a tool or a target
  # never means editing this file.
  matrix:
    runs-on: ubuntu-latest
    outputs:
      # glibc-linked targets build on a plain runner.
      standard: ${{ steps.gen.outputs.standard }}
      # linux-x64 builds inside Alpine so the result links against musl and is
      # fully static. It needs its own job because a matrix cannot mix
      # containerised and non-containerised runners.
      alpine: ${{ steps.gen.outputs.alpine }}
      # Targets that produced artifacts, for the smoke job.
      smoke: ${{ steps.gen.outputs.smoke }}
    steps:
      - uses: actions/checkout@v5
      - id: gen
        run: |
          set -euo pipefail
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os

          # versions.lock columns:
          #   tool <TAB> repo <TAB> ref <TAB> variant <TAB> targets
          # `targets` is a comma-separated allow-list; empty means every target.
          entries = []
          with open("versions.lock") as fh:
              for line in fh:
                  line = line.strip()
                  if not line or line.startswith("#"):
                      continue
                  parts = line.split("\t")
                  if len(parts) < 3:
                      continue
                  entries.append({
                      "tool": parts[0],
                      "variant": parts[3] if len(parts) > 3 else "",
                      "targets": [t for t in (parts[4] if len(parts) > 4 else "").split(",") if t],
                  })

          # Deduplicate: a tool may appear several times with different variants.
          seen, uniq = set(), []
          for e in entries:
              key = (e["tool"], e["variant"])
              if key in seen:
                  continue
              seen.add(key)
              uniq.append(e)

          all_targets = sorted(f[:-4] for f in os.listdir("targets") if f.endswith(".env"))

          # A version entry without a recipe is a placeholder; building it would
          # fail, so it is skipped until the recipe lands.
          recipes = {f[:-3] for f in os.listdir("recipes") if f.endswith(".sh")}
          uniq = [e for e in uniq if e["tool"] in recipes]

          standard, alpine, built_targets = [], [], set()
          for e in uniq:
              for target in (e["targets"] or all_targets):
                  if target not in all_targets:
                      raise SystemExit(f"versions.lock names unknown target {target!r}")
                  built_targets.add(target)
                  item = {"tool": e["tool"], "variant": e["variant"], "target": target}
                  (alpine if target == "linux-x64" else standard).append(item)

          # A matrix must be a mapping, so the list is wrapped in `include`.
          print("standard=" + json.dumps({"include": standard}))
          print("alpine=" + json.dumps({"include": alpine}))
          print("smoke=" + json.dumps(sorted(built_targets)))
          PY

  build:
    needs: matrix
    if: ${{ needs.matrix.outputs.standard != '{"include": []}' }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.matrix.outputs.standard) }}
    # Public repositories get the arm64 runners for free with no minute limit,
    # so linux-arm64 builds natively instead of cross-compiling.
    runs-on: ${{ matrix.target == 'linux-arm64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v5

      - name: Install build dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y build-essential cmake nasm yasm git pkg-config zstd

      - name: Install cross toolchain
        run: |
          set -euo pipefail
          case "${{ matrix.target }}" in
            linux-arm64)
              # Native arm64 runner; nothing to install.
              ;;
            linux-riscv64)
              sudo apt-get install -y gcc-riscv64-linux-gnu g++-riscv64-linux-gnu
              ;;
            win-x64|win-arm64)
              # llvm-mingw is the only toolchain that covers win-arm64: GCC
              # mingw-w64 has no aarch64 support.
              git clone --depth 1 https://github.com/mstorsjo/llvm-mingw
              LLVM_MINGW="$(ls -d "$PWD"/llvm-mingw/llvm-mingw-* | head -1)"
              echo "$LLVM_MINGW/bin" >> "$GITHUB_PATH"
              ;;
          esac

      - name: Build
        run: ./scripts/build.sh "${{ matrix.tool }}" "${{ matrix.target }}" "${{ matrix.variant }}"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.tool }}-${{ matrix.variant }}-${{ matrix.target }}
          path: out/${{ matrix.target }}/
          if-no-files-found: error

  # linux-x64 is built in Alpine so the result links against musl. A matrix
  # cannot mix containerised and non-containerised runners, hence the separate
  # job.
  build-alpine:
    needs: matrix
    if: ${{ needs.matrix.outputs.alpine != '{"include": []}' }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.matrix.outputs.alpine) }}
    runs-on: ubuntu-latest
    container: alpine:3.20
    steps:
      - uses: actions/checkout@v5

      - name: Install build dependencies
        run: |
          apk add --no-cache bash build-base cmake nasm yasm git tar zstd \
            pkgconf linux-headers

      - name: Build
        run: ./scripts/build.sh "${{ matrix.tool }}" "${{ matrix.target }}" "${{ matrix.variant }}"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.tool }}-${{ matrix.variant }}-${{ matrix.target }}
          path: out/${{ matrix.target }}/
          if-no-files-found: error

  smoke:
    needs: [matrix, build, build-alpine]
    if: always() && (needs.build.result == 'success' || needs.build-alpine.result == 'success')
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.matrix.outputs.smoke) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v4
        with:
          path: out
          # Each build job uploaded to out/<target>/, so the artifacts land
          # side by side exactly as smoke.sh expects.
          merge-multiple: true

      - name: Install emulators
        run: |
          sudo apt-get update
          # QEMU runs the riscv64 and arm64 results; wine runs the Windows ones.
          sudo apt-get install -y qemu-user-static || true
          sudo apt-get install -y wine64 || sudo apt-get install -y wine || true

      - name: Smoke test
        run: ./scripts/smoke.sh "${{ matrix.target }}"
